# ───────────── 기본 설정 (개발용, 프로필을 따로 지정하지 않으면 이 설정) ─────────────
# H2 데이터베이스를 파일(./data/illegalcar.mv.db)로 저장해서, 서버를 껐다 켜도 기록이 남아요.
spring:
  application:
    name: illegalcardetector
  config:
    # API 키 같은 비밀 값은 backend/secrets.properties에 따로 써요. (git에 올라가지 않는 파일)
    # 파일이 없어도 괜찮아요(optional). 환경변수가 있으면 환경변수가 먼저예요.
    import: optional:file:./secrets.properties
  datasource:
    url: jdbc:h2:file:./data/illegalcar
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update # 엔티티를 보고 테이블을 자동으로 만들거나 고쳐요
    open-in-view: false
  h2:
    console:
      # 기본은 꺼져 있어요. 터널 등으로 서버를 공개하면 누구나 DB 화면에 들어올 수 있어서 위험해요.
      # 필요할 때만 켜기: .\gradlew.bat bootRun --args="--spring.h2.console.enabled=true"
      # (켠 상태에서는 Cloudflare 터널을 끄고, http://localhost:8080/h2-console 로만 접속하세요)
      enabled: false
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB # /api/analyze 사진 최대 크기
      max-request-size: 6MB

server:
  port: 8080
  tomcat:
    max-swallow-size: 20MB # 너무 큰 사진도 연결을 끊지 않고 400 안내를 보낼 수 있게

# 사진 판별 AI (사진을 볼 수 있는 비전 LLM)
# API 키는 여기에 쓰지 말고 secrets.properties나 환경변수로 넣어요. (claude: ANTHROPIC_API_KEY, nvidia: NVIDIA_API_KEY)
# 바꿀 때는 frontend/src/constants/aiInfo.js의 화면 안내 문구도 같이 바꿔 주세요.
ai:
  provider: claude # claude(기본) 또는 nvidia. 판별 기록의 modelVersion도 따라 바뀌어요.

# Anthropic Claude (ai.provider가 claude일 때)
claude:
  model: claude-sonnet-5-5 # 판별 기록의 modelVersion으로도 써요
  effort: low # 답하기 전에 생각하는 깊이: low, medium, high (높을수록 꼼꼼하지만 느리고 비싸요)
  timeout: 30s # 한 번 호출에서 답을 기다리는 최대 시간. 넘으면 한 번 더 시도해요. (프론트는 70초까지 기다려요)

# NVIDIA Build (ai.provider가 nvidia일 때)
nvidia:
  base-url: https://integrate.api.nvidia.com/v1
  # 사진을 볼 수 있는 모델 이름. 바꾸면 판별 기록의 modelVersion도 따라 바뀌어요. (예: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning → nemotron-3-nano-omni)
  # 2026-11-05 실측: Super VL(120B)이 1~5초로 빠르면서 차가 없는 사진을 가장 잘 걸러 냈어요.
  # (Nano Omni도 쓸 수 있어요: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning)
  model: nvidia/nemotron-3.5-super-vl-120b-a12b
  read-timeout: 60s # AI 응답을 기다리는 최대 시간 (프론트는 70초까지 기다려요)
  reasoning: false # true면 AI가 생각 과정을 거친 뒤 답해요. 더 꼼꼼하지만 느려져요.

---
# ───────────── postgres 프로필 (Supabase 같은 PostgreSQL에 연결할 때) ─────────────
# 실행: gradlew.bat bootRun --args="--spring.profiles.active=postgres"
# 접속 정보는 환경변수 DB_URL, DB_USERNAME, DB_PASSWORD로만 받아요. 이 파일에 값을 쓰지 마세요!
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false
